
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — Змейка</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0b1120;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.game {
    width: 100%;
    max-width: 480px;
    text-align: center;
}

h1 {
    color: #4ade80;
    font-size: 38px;
    margin-bottom: 6px;
}

.subtitle { color: #94a3b8; }

.stats {
    display: flex;
    gap: 12px;
    margin: 22px 0 14px;
}

.stat {
    flex: 1;
    padding: 13px 5px;
    background: #172033;
    border: 1px solid #29364c;
    border-radius: 12px;
}

.stat span {
    display: block;
    color: #4ade80;
    font-size: 25px;
    font-weight: bold;
    margin-top: 5px;
}

canvas {
    width: 100%;
    height: auto;
    display: block;
    background: #111c2e;
    border: 2px solid #334155;
    border-radius: 12px;
}

.settings {
    margin-top: 18px;
    text-align: left;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #cbd5e1;
}

select, button {
    font-size: 16px;
    border-radius: 9px;
    padding: 12px;
}

select {
    width: 100%;
    color: white;
    background: #172033;
    border: 1px solid #475569;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

button {
    flex: 1;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

.primary {
    background: #4ade80;
    color: #102019;
}

.secondary {
    background: #29364c;
    color: white;
}

button:hover { filter: brightness(1.12); }

#message {
    min-height: 24px;
    color: #cbd5e1;
    margin: 17px 0 8px;
}

.help {
    font-size: 13px;
    color: #64748b;
    line-height: 1.7;
}
</style>
</head>

<body>
<div class="game">
    <h1>🐍 SNAKE</h1>
    <div class="subtitle">Собери еду. Побей рекорд.</div>

    <div class="stats">
        <div class="stat">
            СЧЁТ
            <span id="score">0</span>
        </div>
        <div class="stat">
            РЕКОРД
            <span id="best">0</span>
        </div>
    </div>

    <canvas id="canvas" width="400" height="400"></canvas>

    <div class="settings">
        <label for="speed">Скорость игры</label>
        <select id="speed">
            <option value="190">Медленная</option>
            <option value="130" selected>Нормальная</option>
            <option value="80">Быстрая</option>
        </select>
    </div>

    <div class="buttons">
        <button class="primary" id="start">▶ Играть</button>
        <button class="secondary" id="pause">Ⅱ Пауза</button>
    </div>

    <p id="message">Нажми «Играть», чтобы начать!</p>

    <div class="help">
        Управление: стрелочки на клавиатуре<br>
        Пробел — пауза
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const scoreText = document.getElementById("score");
const bestText = document.getElementById("best");
const message = document.getElementById("message");
const speedSelect = document.getElementById("speed");
const startButton = document.getElementById("start");
const pauseButton = document.getElementById("pause");

const cell = 20;
const total = canvas.width / cell;

let snake, food, dx, dy, score;
let state = "menu";
let timer = null;

let best = 0;
try {
    best = Number(localStorage.getItem("snakeBest")) || 0;
} catch (error) {}
bestText.textContent = best;

function reset() {
    snake = [
        {x: 10, y: 10},
        {x: 9, y: 10},
        {x: 8, y: 10}
    ];

    dx = 1;
    dy = 0;
    score = 0;
    scoreText.textContent = score;
    createFood();
    draw();
}

function createFood() {
    do {
        food = {
            x: Math.floor(Math.random() * total),
            y: Math.floor(Math.random() * total)
        };
    } while (
        snake.some(part =>
            part.x === food.x && part.y === food.y
        )
    );
}

function draw() {
    ctx.clearRect(0, 0, 400, 400);

    // Игровая сетка
    ctx.strokeStyle = "#19263a";
    ctx.lineWidth = 1;

    for (let i = 0; i <= total; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cell, 0);
        ctx.lineTo(i * cell, 400);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * cell);
        ctx.lineTo(400, i * cell);
        ctx.stroke();
    }

    // Еда
    ctx.fillStyle = "#fb7185";
    ctx.beginPath();
    ctx.arc(
        food.x * cell + 10,
        food.y * cell + 10,
        8, 0, Math.PI * 2
    );
    ctx.fill();

    // Змейка
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#86efac" : "#22c55e";

        ctx.beginPath();
        ctx.roundRect(
            part.x * cell + 1,
            part.y * cell + 1,
            cell - 2,
            cell - 2,
            5
        );
        ctx.fill();
    });

    // Глаза
    ctx.fillStyle = "#102019";
    const head = snake[0];

    let eyes;
    if (dx === 1) {
        eyes = [[14, 5], [14, 13]];
    } else if (dx === -1) {
        eyes = [[5, 5], [5, 13]];
    } else if (dy === -1) {
        eyes = [[5, 5], [13, 5]];
    } else {
        eyes = [[5, 14], [13, 14]];
    }

    eyes.forEach(([x, y]) => {
        ctx.fillRect(head.x * cell + x, head.y * cell + y, 3, 3);
    });

    if (state === "menu" || state === "paused" || state === "over") {
        ctx.fillStyle = "rgba(11,17,32,0.78)";
        ctx.fillRect(0, 0, 400, 400);

        ctx.textAlign = "center";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px Arial";

        const title = state === "menu"
            ? "ГОТОВ ИГРАТЬ?"
            : state === "paused"
                ? "ПАУЗА"
                : "ИГРА ОКОНЧЕНА";

        ctx.fillText(title, 200, 185);

        ctx.font = "16px Arial";
        ctx.fillStyle = "#4ade80";

        const subtitle = state === "menu"
            ? "Нажми кнопку «Играть»"
            : state === "paused"
                ? "Нажми пробел, чтобы продолжить"
                : "Твой счёт: " + score;

        ctx.fillText(subtitle, 200, 220);
    }
}

function startGame() {
    clearInterval(timer);
    reset();
    state = "playing";
    message.textContent = "Удачи! Не врежься в себя.";
    startButton.textContent = "↻ Заново";
    pauseButton.textContent = "Ⅱ Пауза";
    timer = setInterval(tick, Number(speedSelect.value));
    draw();
}

function togglePause() {
    if (state === "playing") {
        state = "paused";
        clearInterval(timer);
        timer = null;
        message.textContent = "Игра на паузе.";
        pauseButton.textContent = "▶ Продолжить";
        draw();
    } else if (state === "paused") {
        state = "playing";
        timer = setInterval(tick, Number(speedSelect.value));
        message.textContent = "Продолжаем!";
        pauseButton.textContent = "Ⅱ Пауза";
        draw();
    }
}

function endGame() {
    state = "over";
    clearInterval(timer);
    timer = null;

    if (score > best) {
        best = score;
        bestText.textContent = best;

        try {
            localStorage.setItem("snakeBest", String(best));
        } catch (error) {}
        message.textContent = "🏆 Новый рекорд!";
    } else {
        message.textContent = "💀 Попробуй ещё раз!";
    }

    startButton.textContent = "↻ Играть снова";
    draw();
}

function tick() {
    if (state !== "playing") return;

    const head = {
        x: snake[0].x + dx,
        y: snake[0].y + dy
    };

    const eating = head.x === food.x && head.y === food.y;

    // Столкновение со стенами
    if (
        head.x < 0 || head.x >= total ||
        head.y < 0 || head.y >= total
    ) {
        endGame();
        return;
    }

    // Хвост освобождает клетку, если змейка не ест
    const body = eating ? snake : snake.slice(0, -1);

    if (body.some(part =>
        part.x === head.x && part.y === head.y
    )) {
        endGame();
        return;
    }

    snake.unshift(head);

    if (eating) {
        score++;
        scoreText.textContent = score;
        createFood();
    } else {
        snake.pop();
    }

    draw();
}

document.addEventListener("keydown", event => {
    const key = event.key;

    if ([
        "ArrowUp", "ArrowDown", "ArrowLeft",
        "ArrowRight", " "
    ].includes(key)) {
        event.preventDefault();
    }

    if (key === " " && (state === "playing" || state === "paused")) {
        togglePause();
        return;
    }

    if (state !== "playing") {
        if (
            ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(key)
            && (state === "menu" || state === "over")
        ) {
            startGame();
        } else {
            return;
        }
    }

    if (key === "ArrowUp" && dy !== 1) {
        dx = 0; dy = -1;
    } else if (key === "ArrowDown" && dy !== -1) {
        dx = 0; dy = 1;
    } else if (key === "ArrowLeft" && dx !== 1) {
        dx = -1; dy = 0;
    } else if (key === "ArrowRight" && dx !== -1) {
        dx = 1; dy = 0;
    }
});

startButton.addEventListener("click", startGame);
pauseButton.addEventListener("click", togglePause);

speedSelect.addEventListener("change", () => {
    if (state === "playing") {
        clearInterval(timer);
        timer = setInterval(tick, Number(speedSelect.value));
    }
});

reset();
</script>
</body>
</html>
